# Máy cá nhân Giai đoạn 0: Windows, RTX 3050 Laptop 6 GB (decisions.md D14-D15 của repo cũ).
name: local6gb
render:
  batch_poses: 1          # đỉnh 8,6 GB khi render 2 tư thế cùng lúc trên card 6 GB (D14)
  resample_mm: 1.0        # bộ nhớ đỉnh 3,1-3,8 GB, ~1,1 s mỗi tư thế (D15)
train:
  batch_size: null        # điền theo mô hình; mixed precision nếu thiếu bộ nhớ
  amp: false
  num_workers: 0          # Windows: DataLoader dùng num_workers=0
cache:
  dir: data/cache/drr
