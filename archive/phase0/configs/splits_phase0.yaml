# Source-domain (CT) folds for the DRR dataset. SPLIT BY CT CASE, never by image: the 40 DRRs of one CT
# are near-duplicates, so splitting by image would leak the same patient into train and validation.
# 4 folds as in DRR4Covid (the paper's own fold assignment is not given). With 10 usable CTs the folds
# have 3/3/2/2 cases. Found by exhaustive search over all partitions of that shape, minimising the
# spread of the mean infection volume (PIV, % of lung) per fold; see docs/experiment_design.md.
seed_note: "deterministic, found by brute force on 2026-11-07; do not re-draw"
folds:
  0: [coronacases_001, coronacases_006, coronacases_007]   # mean PIV 6.3
  1: [coronacases_003, coronacases_004, coronacases_005]   # mean PIV 10.9
  2: [coronacases_002, coronacases_008]                    # mean PIV 5.85
  3: [coronacases_009, coronacases_010]                    # mean PIV 10.85
piv_percent:                    # from the EDA (docs/data_card_covid19_ctseg.md)
  coronacases_001: 12.9
  coronacases_002: 4.1
  coronacases_003: 29.6
  coronacases_004: 1.4
  coronacases_005: 1.7
  coronacases_006: 2.9
  coronacases_007: 3.1
  coronacases_008: 7.6
  coronacases_009: 4.0
  coronacases_010: 17.7
