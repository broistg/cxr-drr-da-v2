name: e17b_null_center
description: "E17b (D50): null xáo nhãn cho khung 'center' (D49 ghi: chưa có null cho maskout/center). Null ~0,50-0,55 nghĩa là AUROC center không do hình hộp/đường tắt tạo ra từ nhãn xáo. Cần dữ liệu center đã chuẩn bị (--frame center)."
defaults:
  arm: a0
  profile: moderate
  views: [ap]
  select: source_val
  shuffle-labels: true
  out-dir: outputs/e10_opacity_center
  vindr-dir: data/processed/cxr_adult_opacity_center
seeds: [0, 1, 2]
variants:
  - {name: a0_null_f0, args: {val-fold: 0}}
  - {name: a0_null_f1, args: {val-fold: 1}}
diagnostics: [confounds]
diagnostic_args:
  confounds: {out-root: outputs/e10_opacity_center, vindr-dir: data/processed/cxr_adult_opacity_center}
summary: true
summary_args: {dir: outputs/e10_opacity_center}
