name: e17b_null_maskout
description: "E17b (D50): null xáo nhãn cho khung 'maskout' (D49 ghi: chưa có null cho maskout/center). Null ~0,50-0,55 nghĩa là AUROC maskout không do hình hộp/đường tắt tạo ra từ nhãn xáo. Cần dữ liệu maskout đã chuẩn bị (--frame maskout)."
defaults:
  arm: a0
  profile: moderate
  views: [ap]
  select: source_val
  shuffle-labels: true
  out-dir: outputs/e10_opacity_maskout
  vindr-dir: data/processed/cxr_adult_opacity_maskout
seeds: [0, 1, 2]
variants:
  - {name: a0_null_f0, args: {val-fold: 0}}
  - {name: a0_null_f1, args: {val-fold: 1}}
diagnostics: [confounds]
diagnostic_args:
  confounds: {out-root: outputs/e10_opacity_maskout, vindr-dir: data/processed/cxr_adult_opacity_maskout}
summary: true
summary_args: {dir: outputs/e10_opacity_maskout}
