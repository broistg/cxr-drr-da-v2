name: e10a_folds
description: "A0 trên E10a với các fold CT còn lại làm nguồn giữ ra (D41): fold 1, 2, 3 (fold 0 đã chạy ở e10a_opacity_selsrc). Đo độ ổn định theo ca CT; mỗi fold huấn luyện trên các ca khác."
defaults:
  arm: a0
  profile: moderate
  views: [ap]
  select: source_val
  out-dir: outputs/e10_opacity
  vindr-dir: data/processed/cxr_adult_opacity
seeds: [0, 1, 2]
variants:
  - {name: a0_fold1, args: {val-fold: 1}}
  - {name: a0_fold2, args: {val-fold: 2}}
  - {name: a0_fold3, args: {val-fold: 3}}
diagnostics: [confounds]
diagnostic_args:
  confounds: {out-root: outputs/e10_opacity, vindr-dir: data/processed/cxr_adult_opacity}
summary: true
summary_args: {dir: outputs/e10_opacity}
