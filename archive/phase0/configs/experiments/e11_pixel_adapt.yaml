name: e11_pixel_adapt
description: "E11 + AdaBN trên E10a (D41): thích nghi pixel không nhãn (khớp histogram, FDA) và thống kê BatchNorm đích cho A0. Chọn checkpoint theo nguồn giữ ra (không dùng nhãn đích). So với a0_selsrc của e10a_opacity_selsrc.yaml (0,821 ± 0,019). Cần: prep_covid19_radiography.py --task opacity."
defaults:
  arm: a0
  profile: moderate
  views: [ap]
  val-fold: 0
  select: source_val
  out-dir: outputs/e10_opacity
  vindr-dir: data/processed/cxr_adult_opacity
seeds: [0, 1, 2]
variants:
  - {name: a0_hist,  args: {pixel-adapt: hist}}
  - {name: a0_fda5,  args: {pixel-adapt: fda, fda-beta: 0.05}}
  - {name: a0_adabn, args: {adabn: true}}
diagnostics: [confounds]
diagnostic_args:
  confounds: {out-root: outputs/e10_opacity, vindr-dir: data/processed/cxr_adult_opacity}
summary: true
summary_args: {dir: outputs/e10_opacity}
