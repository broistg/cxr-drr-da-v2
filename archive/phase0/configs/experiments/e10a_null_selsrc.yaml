name: e10a_null_selsrc
description: "Mục 2: null xáo nhãn cho đích người lớn với source_val (không dùng nhãn đích), để so sánh cùng cách chọn với A0 selsrc 0,809 (D39). Null ~0,50-0,55 nghĩa là không có rò rỉ; null cao hơn nghĩa là cách chọn/đường tắt tự tạo AUROC."
defaults:
  arm: a0
  profile: moderate
  views: [ap]
  select: source_val
  shuffle-labels: true
  out-dir: outputs/e10_opacity
  vindr-dir: data/processed/cxr_adult_opacity
seeds: [0, 1, 2]
variants:
  - {name: a0_null_selsrc_f0, args: {val-fold: 0}}
  - {name: a0_null_selsrc_f1, args: {val-fold: 1}}
diagnostics: [confounds]
diagnostic_args:
  confounds: {out-root: outputs/e10_opacity, vindr-dir: data/processed/cxr_adult_opacity}
summary: true
summary_args: {dir: outputs/e10_opacity}
